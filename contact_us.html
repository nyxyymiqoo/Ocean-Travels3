<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Travels</title>
    <link rel="stylesheet" href="style.css">

</head>

<body style="background-image: url('ocean1.png'); background-repeat: no-repeat;">

    <nav class="navbar">
        <a href="index.html" class="logo">Ocean Travels</a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html">Contact Us</a></li>
        </ul>

        <div id="search">
            <input id="searchinput" class="searchinput" placeholder="Enter a destination" aria-label="Search destinations" type="search">
            <button id="searchbtn" class="btn" type="button">Search</button>
            <button id="clearbtn" class="btn" type="button">Clear</button>
        </div>
        <div id="dropdown" hidden>
            <div class="dropdown-header"><button id="close-btn" type="button" aria-label="Close search results">X</button></div>
            <div id="resultContainer" aria-live="polite"></div>
        </div>
    </nav>

    <div class="contact-layout">
        <main>
            <h1>Contact us</h1>

            <p>
                Get in touch with us! We would love to hear from you.
                Whether you have questions, feedback, or just want to say hello, feel free to reach out.
            </p>

        </main>

        <form class="form" onsubmit="myFunction(event)">
            <h2>Send us a message</h2>
            <label for="fname">Name</label>
            <input type="text" id="fname" name="fname" placeholder="Your name" autocomplete="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
            <button type="submit">Send message</button>
        </form>
    </div>

    <script>
        function myFunction(event) {
            event.preventDefault();
            alert("Thank you for your message! We will get back to you soon.");
        }
    </script>

    <script src="travel_recommendation.js"></script>

</body>
</html>
